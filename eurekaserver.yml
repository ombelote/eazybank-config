server:
  port: 8070
eureka:
  instance:
    hostname: localhost
#    fetchRegistry is false because we dont want to fetch the registry details of other microservices
#    register with Eureka is false because we dont want eureka to register with itself.
  client:
    fetchRegistry: false
    registerWithEureka: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/